<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the wedding, portrait, event, and couples photography portfolio of Lena Hart."
    />
    <title>Lena Hart Photography | Portfolio</title>
    <link rel="icon" href="images/favicon/favicon.svg" type="image/svg+xml" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <!-- Navigation Bar | Start -->
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Lena Hart Photography Button -->
          <a href="index.html" class="navbar-brand mx-auto mx-lg-0">
            Lena Hart Photography
          </a>

          <!-- Selection | Responsive -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-lg-5">
              <!-- Home -->
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>

              <!-- About -->
              <li class="nav-item">
                <a class="nav-link" href="about.html">About</a>
              </li>

              <!-- Portfolio -->
              <li class="nav-item">
                <a
                  class="nav-link active"
                  href="portfolio.html"
                  aria-current="page"
                >
                  Portfolio
                </a>
              </li>

              <!-- Contact -->
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Navigation Bar | End -->
    </header>
    <main>
      <!-- Portfolio Gallery | Start -->
      <section class="portfolio-section py-5">
        <div class="container">
          <div class="text-center mb-5">
            <h1 class="portfolio-title">Portfolio</h1>
            <p class="portfolio-subtitle">
              A collection of moments, stories, and memories.
            </p>
          </div>

          <!-- Portfolio Filters | Start -->
          <div
            class="portfolio-filters d-flex flex-wrap justify-content-center gap-2 mb-4"
            aria-label="Portfolio categories"
          >
            <button class="filter-btn active" data-filter="all" type="button">
              All
            </button>
            <button class="filter-btn" data-filter="Weddings" type="button">
              Weddings
            </button>
            <button class="filter-btn" data-filter="Portraits" type="button">
              Portraits
            </button>
            <button class="filter-btn" data-filter="Events" type="button">
              Events
            </button>
            <button class="filter-btn" data-filter="Couples" type="button">
              Couples
            </button>
          </div>
          <!-- Portfolio Filters | End -->

          <div class="row g-4" id="portfolio-gallery"></div>
        </div>
      </section>
      <!-- Portfolio Gallery | End -->
    </main>

    <!-- Footer | Start -->
    <footer class="site-footer">
      <div class="container text-center py-5">
        <h2 class="footer-title">Lena Hart Photography</h2>
        <p class="footer-tagline">Real moments, beautifully kept.</p>

        <div class="footer-socials">
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <i class="bi bi-instagram" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.pinterest.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Pinterest"
          >
            <i class="bi bi-pinterest" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <i class="bi bi-facebook" aria-hidden="true"></i>
          </a>
        </div>

        <p class="footer-copyright">
          &copy; 2026 Lena Hart Photography. All rights reserved.
        </p>
      </div>
    </footer>
    <!-- Footer | End -->

    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/gallery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
